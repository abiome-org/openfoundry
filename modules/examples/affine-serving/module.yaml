apiVersion: openfoundry.dev/v1alpha1
kind: Module
metadata:
  name: affine-serving
spec:
  entryPoint:
    command: [python3, main.py]
  environment:
    dependencyLock: requirements.lock
    dependencyDigest: sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  contracts:
    input:
      type: object
      required: [input]
      properties: {input: {type: number}}
      additionalProperties: false
    output:
      type: object
      required: [prediction]
      properties: {prediction: {type: number}}
      additionalProperties: false
    config:
      type: object
      additionalProperties: false
    state:
      type: object
      required: [path]
      properties: {path: {type: string}}
  fixtures:
    - request:
        operation: run
        inputs: {input: 3.0}
        state: {path: fixture-model.json}
        config: {}
      result:
        status: ok
        outputs: {prediction: 7.0}
