[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openfoundry-stable-executor-test-plugin"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = ["openfoundry>=2,<3"]

[project.entry-points."openfoundry.executors"]
stable-test = "openfoundry_stable_executor:provider"

[tool.hatch.build.targets.wheel]
packages = ["src/openfoundry_stable_executor"]
