services:
  factory:
    build:
      context: .
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "openfoundry bootstrap && exec openfoundry api serve --host 0.0.0.0 --port 8080"
    ports:
      - "${OPENFOUNDRY_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
