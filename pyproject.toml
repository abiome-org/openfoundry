[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openfoundry"
dynamic = ["version"]
description = "Repository-centered, model-neutral development and release system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "OpenFoundry contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: FastAPI",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cryptography>=50.0.1,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "rfc8785>=0.1,<1",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
tracking = ["mlflow-skinny>=3,<4", "sqlalchemy>=2,<3", "alembic>=1.13,<2"]
s3 = ["boto3>=1.40,<2"]
telemetry = [
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
openfoundry = "openfoundry.cli:app"

[project.urls]
Documentation = "https://github.com/abiome-org/openfoundry"
Repository = "https://github.com/abiome-org/openfoundry"
Issues = "https://github.com/abiome-org/openfoundry/issues"

[tool.hatch.version]
path = "factory/openfoundry/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["factory/openfoundry"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/CONTRIBUTING.md",
  "/Makefile",
  "/tools/bootstrap.py",
  "/CHANGELOG.md",
  "/bindings",
  "/data/fixtures",
  "/deployments",
  "/factory",
  "/docs",
  "/evaluations",
  "/examples",
  "/install.sh",
  "/model-packages",
  "/modules/examples",
  "/openfoundry.yaml",
  "/policies",
  "/README.md",
  "/requirements.build.in",
  "/requirements.build.lock",
  "/requirements.lock",
  "/requirements.runtime.lock",
  "/templates",
  "/workloads",
  "/LICENSE",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["openfoundry"]
# These workers execute as real child processes beyond in-process coverage tracing.
omit = ["*/executors/local_worker.py", "*/run_worker.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "A", "C4", "C90", "DTZ", "ISC", "PIE", "PT", "RUF", "SIM",
  "PLR0911", "PLR0912", "PLR0915",
]
ignore = ["ISC001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"factory/openfoundry/api.py" = ["B008"]
"factory/openfoundry/cli.py" = ["B008"]
"tests/*" = ["PLR0915"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["openfoundry"]
