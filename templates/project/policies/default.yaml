apiVersion: openfoundry.dev/v1alpha1
kind: Policy
metadata:
  name: default
spec:
  rules:
    - name: allow-local-project-operations
      effect: allow
      match:
        actor: local-user
        resource: __OPENFOUNDRY_PROJECT_NAMESPACE__
  config:
    dirtyWorktree: archive
    promotion:
      requireEvaluationPass: true
