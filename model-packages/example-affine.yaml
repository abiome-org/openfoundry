apiVersion: openfoundry.dev/v1alpha1
kind: ModelPackage
metadata:
  name: example-affine
spec:
  signatures:
    input:
      type: object
      required: [input]
      properties: {input: {type: number}}
      additionalProperties: false
    output:
      type: object
      required: [prediction]
      properties: {prediction: {type: number}}
      additionalProperties: false
    state:
      type: object
      required: [path]
      properties: {path: {type: string}}
  adapters:
    trainingReference:
      stage: train
      operation: run
      config: {action: train}
    inferenceReference:
      module: modules/examples/affine-serving/module.yaml
      operation: run
      stateOutput: train.model
      config: {}
  compatibilityVectors:
    - name: positive
      method: predict
      inputs: {input: 3.0}
      expected: {prediction: 7.0}
      tolerances:
        prediction: {absolute: 0.01, relative: 0.001}
